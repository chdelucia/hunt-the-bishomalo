@let opened = isOpen();

<button
  class="menu-toggle"
  [class.open]="opened"
  (click)="toggleMenu()"
  [attr.aria-label]="(opened ? 'menu.closeMenuAriaLabel' : 'menu.openMenuAriaLabel') | transloco"
  [attr.aria-expanded]="opened"
  aria-controls="mobile-navigation"
>
  <div class="bar bar1" [class.open]="opened"></div>
  <div class="bar bar2" [class.open]="opened"></div>
  <div class="bar bar3" [class.open]="opened"></div>
</button>

@if (opened) {
  <div class="mobile-menu" id="mobile-navigation">
    <ul>
      <li>
        <button (click)="navigateTo(ROUTES.HOME)">{{ 'menu.home' | transloco }}</button>
      </li>
      <li>
        <button (click)="navigateTo(ROUTES.ACHIEVEMENTS)">
          {{ 'menu.achievements' | transloco }}
        </button>
      </li>
      <li>
        <button (click)="navigateTo(ROUTES.RULES)">{{ 'menu.instructions' | transloco }}</button>
      </li>
      <li>
        <button (click)="navigateTo(ROUTES.SHOP)">{{ 'menu.shop' | transloco }}</button>
      </li>
      <li>
        <button (click)="navigateTo(ROUTES.STORY)">{{ 'menu.story' | transloco }}</button>
      </li>
      <li>
        <button (click)="navigateTo(ROUTES.CREDITS)">{{ 'menu.credits' | transloco }}</button>
      </li>
      <li>
        <button (click)="newGame()" class="newgame">{{ 'menu.newGame' | transloco }}</button>
      </li>
    </ul>
  </div>
}

<div class="menu-desktop">
  <div class="left-icons">
    <a [routerLink]="['/', ROUTES.HOME]" class="menu-link" [title]="'menu.home' | transloco">
      <img
        class="icon"
        [src]="ASSETS_BASE_URL + '/go.svg'"
        alt="{{ 'menu.home' | transloco }}"
      />
    </a>
    <a [routerLink]="['/', ROUTES.ACHIEVEMENTS]" class="menu-link" [title]="'menu.achievements' | transloco">
      <img
        class="icon"
        [src]="ASSETS_BASE_URL + '/trophy.svg'"
        alt="{{ 'menu.achievementsAlt' | transloco }}"
      />
    </a>
    <a [routerLink]="['/', ROUTES.RULES]" class="menu-link" [title]="'menu.instructions' | transloco">
      <img
        class="icon"
        [src]="ASSETS_BASE_URL + '/controller.svg'"
        alt="{{ 'menu.instructions' | transloco }}"
      />
    </a>
    <a [routerLink]="['/', ROUTES.SHOP]" class="menu-link" [title]="'menu.shop' | transloco">
      <img
        class="icon"
        [src]="ASSETS_BASE_URL + '/shop/shield.svg'"
        alt="{{ 'menu.shop' | transloco }}"
      />
    </a>
    <a [routerLink]="['/', ROUTES.STORY]" class="menu-link" [title]="'menu.story' | transloco">
      <img
        class="icon"
        [src]="ASSETS_BASE_URL + '/info.PNG'"
        alt="{{ 'menu.story' | transloco }}"
      />
    </a>
  </div>
  <div class="right-icon">
    <ng-content></ng-content>
  </div>
</div>

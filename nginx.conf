server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    # SPA Routing
    location / {
        try_files $uri $uri/ /index.html;

        # Security Headers (explicitly repeated for consistency)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.lr-in.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://hunt-the-bishomalo.vercel.app https://bold-mouse-42af.c-heredia-naranjo.workers.dev https://huntthebishomalo.c-heredia-naranjo.workers.dev; connect-src 'self' https://*.sentry.io https://*.lr-in.com https://*.lr-ingest.io https://*.lr-ingest.com https://bold-mouse-42af.c-heredia-naranjo.workers.dev https://huntthebishomalo.c-heredia-naranjo.workers.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    }

    # Cache Control for Static Assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm|wav|mp3|ogg|ogv)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Security Headers (Nginx inheritance requires repeating these if add_header is used in a location)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), idle-detection=(), interest-cohort=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), sync-xhr=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
        add_header Content-Security-Policy "upgrade-insecure-requests; default-src 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.lr-in.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://hunt-the-bishomalo.vercel.app https://bold-mouse-42af.c-heredia-naranjo.workers.dev https://huntthebishomalo.c-heredia-naranjo.workers.dev; connect-src 'self' https://*.sentry.io https://*.lr-in.com https://*.lr-ingest.io https://*.lr-ingest.com https://bold-mouse-42af.c-heredia-naranjo.workers.dev https://huntthebishomalo.c-heredia-naranjo.workers.dev; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    }
}
